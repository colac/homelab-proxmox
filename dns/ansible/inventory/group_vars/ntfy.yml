---
# The `ntfy` group: the Pi's notification services (playbooks/ntfy.yml),
# shared by the tailscale, ntfy and ntfy_doorbell roles. Hand-authored.
# Pi-hole's settings are group_vars/pihole.yml's.
#
# The design and its reasons: homelab-proxmox-monitoring's
# docs/ai-ops/architecture.md (Notifications; decisions D1, D2).

# The credentials, from dns/secrets.yaml: made by `mise run
# secrets:generate` (never typed; naming a key there replaces it), passed to
# one `mise run dns:play:ntfy` by .mise/sops-exec's ntfy profile. Only the
# phone logs in with a password; every other client uses its token, and its
# password is a random one the Pi makes and throws away once hashed.
ntfy_passwords:
  phone: "{{ lookup('env', 'NTFY_PHONE_PASSWORD') }}"
ntfy_tokens:
  actions: "{{ lookup('env', 'NTFY_ACTIONS_TOKEN') }}"
  notifier: "{{ lookup('env', 'NTFY_NOTIFIER_TOKEN') }}"
  runner: "{{ lookup('env', 'NTFY_RUNNER_TOKEN') }}"
  doorbell: "{{ lookup('env', 'NTFY_DOORBELL_TOKEN') }}"
ntfy_doorbell_topic: "{{ lookup('env', 'NTFY_DOORBELL_TOPIC') }}"

# ntfy listens on loopback only. `tailscale serve` publishes it to the
# tailnet, over HTTPS, on ntfy_https_port. Nothing else reaches it.
ntfy_port: 2586
ntfy_https_port: 8443

ntfy_topics:
  alerts: homelab-alerts    # monitoring's notifier -> phone, runner
  agent: homelab-agent      # the investigation runner -> phone
  control: homelab-control  # the phone's buttons -> runner

# Who may do what on the private server. Each client needs a token in
# ntfy_tokens or a password in ntfy_passwords. `local: true` leaves the
# token on this host for a service here, at /etc/ntfy/clients/<name>.token
# (root, 0600), which its systemd unit reads with LoadCredential.
ntfy_clients:
  - name: phone
    access:
      - "{{ ntfy_topics.alerts }}:ro"
      - "{{ ntfy_topics.agent }}:ro"
  # The token the phone's buttons send (Stop, Investigate). It travels inside
  # the messages, so it may do nothing but write the control topic.
  - name: actions
    access:
      - "{{ ntfy_topics.control }}:wo"
    local: true
  # monitoring's alert notifier, on this host.
  - name: notifier
    access:
      - "{{ ntfy_topics.alerts }}:wo"
    local: true
  # The investigation runner, on the laptop (monitoring's agent/).
  - name: runner
    access:
      - "{{ ntfy_topics.alerts }}:ro"
      - "{{ ntfy_topics.agent }}:wo"
      - "{{ ntfy_topics.control }}:ro"
  # The doorbell service, on this host.
  - name: doorbell
    access:
      - "{{ ntfy_topics.alerts }}:ro"
      - "{{ ntfy_topics.agent }}:ro"
    local: true
