---
# The doorbell service (files/doorbell.py explains the rules). Needs the ntfy
# role first: it reads the doorbell's token from /etc/ntfy/clients/.

# The topic on ntfy.sh is the doorbell's only protection: anyone who knows
# it can ring. From dns/secrets.yaml (group_vars/ntfy.yml), generated there.
- name: Check the doorbell topic came with the play (mise run dns:play:ntfy)
  ansible.builtin.assert:
    that: ntfy_doorbell_topic is match('^[A-Za-z0-9]{16,64}$')
    fail_msg: >-
      ntfy_doorbell_topic is missing or malformed. It comes from
      dns/secrets.yaml: run `mise run secrets:generate` once, then this play
      through `mise run dns:play:ntfy`.
    quiet: true

- name: Check that the ntfy role has run (playbooks/40-ntfy.yml)
  ansible.builtin.stat:
    path: /etc/ntfy/clients/doorbell.token
  register: _ntfy_doorbell_token

# Under --check on a host where ntfy is not configured yet (its play only
# reports under --check too), there is no token and no /etc/ntfy/clients/.
- name: Say what --check cannot show before ntfy is configured
  ansible.builtin.debug:
    msg: >-
      ntfy is not configured on this host yet, so the doorbell has no token
      to use. Run without --check: playbooks/40-ntfy.yml configures ntfy
      first, then this play shows the rest.
  when: ansible_check_mode and not _ntfy_doorbell_token.stat.exists

- name: Stop this host's doorbell check here
  ansible.builtin.meta: end_host
  when: ansible_check_mode and not _ntfy_doorbell_token.stat.exists

- name: Stop if it has not
  ansible.builtin.assert:
    that: _ntfy_doorbell_token.stat.exists
    fail_msg: "/etc/ntfy/clients/doorbell.token is missing: run playbooks/40-ntfy.yml first."
    quiet: true

- name: Leave the doorbell topic here (read with LoadCredential)
  ansible.builtin.copy:
    dest: /etc/ntfy/clients/doorbell.topic
    content: "{{ ntfy_doorbell_topic }}\n"
    owner: root
    group: root
    mode: "0600"
  notify: Restart ntfy-doorbell
  no_log: true

- name: Create the program's directory
  ansible.builtin.file:
    path: /usr/local/lib/ntfy-doorbell
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the program
  ansible.builtin.copy:
    src: doorbell.py
    dest: /usr/local/lib/ntfy-doorbell/doorbell.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart ntfy-doorbell

- name: Install the systemd unit
  ansible.builtin.template:
    src: ntfy-doorbell.service.j2
    dest: /etc/systemd/system/ntfy-doorbell.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ntfy-doorbell

- name: Enable and start the doorbell
  ansible.builtin.systemd_service:
    name: ntfy-doorbell
    enabled: true
    state: started
    daemon_reload: true

- name: Apply changes now
  ansible.builtin.meta: flush_handlers

- name: Check the doorbell is still running after a few seconds
  ansible.builtin.service_facts:
  register: _ntfy_doorbell_services
  until: >-
    _ntfy_doorbell_services.ansible_facts.services['ntfy-doorbell.service'].state | default('') == 'running'
  retries: 3
  delay: 5
  when: not ansible_check_mode
