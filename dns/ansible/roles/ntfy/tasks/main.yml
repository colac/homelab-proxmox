---
# The private ntfy server (monitoring's docs/ai-ops/architecture.md, D2).
#
# - The release's .deb, pinned by version and sha256. It brings the `ntfy`
#   user and the systemd unit.
# - Users, access rules and tokens are declared in server.yml, not created
#   with the `ntfy user` CLI: the CLI needs a database that only exists
#   after the first start, and declared entries are idempotent (ntfy
#   provisions them at every start, and deletes the ones removed here).
# - Credentials come from dns/secrets.yaml (ntfy_passwords, ntfy_tokens in
#   group_vars/ntfy.yml), generated there by `mise run secrets:generate`.
#   The Pi keeps only bcrypt hashes of the passwords; tokens must be in
#   server.yml.

# Without them (ansible-playbook run directly, not through mise) the play
# would provision empty tokens.
- name: Check the credentials came with the play (mise run dns:play:ntfy)
  ansible.builtin.assert:
    that:
      - ntfy_clients | map(attribute='name') | reject('in', ntfy_tokens) | reject('in', ntfy_passwords) | list | length == 0
      - ntfy_clients | selectattr('local', 'defined') | selectattr('local') | map(attribute='name') | reject('in', ntfy_tokens) | list | length == 0
      - ntfy_tokens.values() | reject('match', '^tk_[a-z0-9]{29}$') | list | length == 0
      - ntfy_passwords.values() | reject('match', '^[A-Za-z0-9]{16,}$') | list | length == 0
    fail_msg: >-
      ntfy's credentials are missing or malformed. They come from
      dns/secrets.yaml: run `mise run secrets:generate` once, then this play
      through `mise run dns:play:ntfy`. Every client in ntfy_clients needs a
      token (ntfy_tokens) or a password (ntfy_passwords); a `local` client
      needs a token.
    quiet: true

- name: Map the CPU to ntfy's package architecture
  ansible.builtin.set_fact:
    _ntfy_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_architecture] | default('unsupported') }}"

- name: Check the architecture has a pinned checksum
  ansible.builtin.assert:
    that: _ntfy_arch in ntfy_deb_sha256
    fail_msg: "No pinned ntfy package for {{ ansible_architecture }} (ntfy_deb_sha256)."
    quiet: true

- name: Read the installed ntfy version
  ansible.builtin.command: dpkg-query --show --showformat=${Version} ntfy
  register: _ntfy_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install ntfy {{ ntfy_version }}
  when: _ntfy_installed.stdout != ntfy_version
  block:
    - name: Download ntfy {{ ntfy_version }}
      ansible.builtin.get_url:
        url: "https://github.com/binwiederhier/ntfy/releases/download/v{{ ntfy_version }}/ntfy_{{ ntfy_version }}_linux_{{ _ntfy_arch }}.deb"
        dest: "/var/cache/apt/archives/ntfy_{{ ntfy_version }}_linux_{{ _ntfy_arch }}.deb"
        checksum: "sha256:{{ ntfy_deb_sha256[_ntfy_arch] }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install the package
      ansible.builtin.apt:
        deb: "/var/cache/apt/archives/ntfy_{{ ntfy_version }}_linux_{{ _ntfy_arch }}.deb"
      when: not ansible_check_mode
      notify: Restart ntfy

# Under --check on the first run nothing was installed: there is no ntfy to
# hash with and no `ntfy` group to own files, so the rest only reports.
- name: Decide whether the rest can run
  ansible.builtin.set_fact:
    _ntfy_present: "{{ not ansible_check_mode or _ntfy_installed.stdout | length > 0 }}"

# ---------------------------------------------------------------------------
# The server's public name: the host's tailnet name (30-tailscale.yml)
# ---------------------------------------------------------------------------

- name: Read this host's tailnet name
  ansible.builtin.command: tailscale status --json
  register: _ntfy_tailscale
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note whether Tailscale is up
  ansible.builtin.set_fact:
    _ntfy_tailscale_up: >-
      {{ _ntfy_tailscale.rc == 0
         and (_ntfy_tailscale.stdout | from_json).BackendState | default('') == 'Running' }}

# Under --check on a host where Tailscale is not set up yet (its play only
# reports under --check too), there is no address to configure ntfy with.
- name: Say what --check cannot show before Tailscale is up
  ansible.builtin.debug:
    msg: >-
      Tailscale is not up on this host yet, so ntfy has no address to be
      configured with. Run without --check: playbooks/30-tailscale.yml sets
      Tailscale up first, then this play shows the rest.
  when: ansible_check_mode and not (_ntfy_tailscale_up | bool)

- name: Stop this host's ntfy check here
  ansible.builtin.meta: end_host
  when: ansible_check_mode and not (_ntfy_tailscale_up | bool)

- name: Check that Tailscale is up (playbooks/30-tailscale.yml)
  ansible.builtin.assert:
    that: _ntfy_tailscale_up | bool
    fail_msg: "Tailscale is not running on this host: run playbooks/30-tailscale.yml first."
    quiet: true

- name: Derive the server's address
  ansible.builtin.set_fact:
    _ntfy_base_url: >-
      https://{{ (_ntfy_tailscale.stdout | from_json).Self.DNSName | regex_replace('\.$', '') }}:{{ ntfy_https_port }}

# ---------------------------------------------------------------------------
# Server configuration
# ---------------------------------------------------------------------------

- name: Configure ntfy
  when: _ntfy_present
  block:
    - name: Create the directories for hashes and local clients' tokens
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/ntfy/provisioned
        - /etc/ntfy/clients

    # bcrypt hashes are salted, so hashing every run would rewrite server.yml
    # every run. A hash is made again only when its password changed, which
    # the stored sha256 of the password tells. A client without a password
    # (it uses its token) gets a random one, made here and thrown away once
    # hashed: nobody holds it. Its .sum says `random`, so a hash of a
    # password that someone did hold is replaced.
    - name: Hash each client's password (only when it changed)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          umask 077
          dir=/etc/ntfy/provisioned
          sum=${NTFY_SUM:-random}
          if [[ -s $dir/$NTFY_CLIENT.hash && "$(cat "$dir/$NTFY_CLIENT.sum" 2>/dev/null)" == "$sum" ]]; then
            echo unchanged
            exit 0
          fi
          if [[ -z $NTFY_PASSWORD ]]; then
            NTFY_PASSWORD=$(head -c 24 /dev/urandom | base64)
          fi
          printf '%s\n%s\n' "$NTFY_PASSWORD" "$NTFY_PASSWORD" | ntfy user hash >"$dir/$NTFY_CLIENT.hash.new" 2>/dev/null
          mv "$dir/$NTFY_CLIENT.hash.new" "$dir/$NTFY_CLIENT.hash"
          printf '%s' "$sum" >"$dir/$NTFY_CLIENT.sum"
          echo hashed
      environment:
        NTFY_CLIENT: "{{ item.name }}"
        NTFY_PASSWORD: "{{ ntfy_passwords[item.name] | default('') }}"
        NTFY_SUM: "{{ (ntfy_passwords[item.name] | hash('sha256')) if item.name in ntfy_passwords else '' }}"
      loop: "{{ ntfy_clients }}"
      loop_control:
        label: "{{ item.name }}"
      register: _ntfy_hash
      changed_when: "'hashed' in (_ntfy_hash.stdout | default(''))"
      no_log: true

    - name: Read the password hashes
      ansible.builtin.slurp:
        src: "/etc/ntfy/provisioned/{{ item.name }}.hash"
      loop: "{{ ntfy_clients }}"
      loop_control:
        label: "{{ item.name }}"
      register: _ntfy_hash_files
      # Under --check a new client has no hash yet.
      failed_when: false
      no_log: true

    - name: Collect the password hashes
      ansible.builtin.set_fact:
        _ntfy_hashes: >-
          {{ _ntfy_hashes | default({}) | combine({item.item.name:
               (item.content | b64decode | trim) if item.content is defined else 'HASHED-ON-THE-REAL-RUN'}) }}
      loop: "{{ _ntfy_hash_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Write server.yml
      ansible.builtin.template:
        src: server.yml.j2
        dest: /etc/ntfy/server.yml
        owner: root
        group: ntfy
        mode: "0640"
      notify: Restart ntfy
      # Holds the tokens and hashes; --diff would print them.
      diff: false

    - name: Leave the tokens of this host's own services here (read with LoadCredential)
      ansible.builtin.copy:
        dest: "/etc/ntfy/clients/{{ item.name }}.token"
        content: "{{ ntfy_tokens[item.name] }}\n"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ ntfy_clients | selectattr('local', 'defined') | selectattr('local') | list }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Publish the server's address for local services (not a secret)
      ansible.builtin.copy:
        dest: /etc/ntfy/base-url
        content: "{{ _ntfy_base_url }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Create the directory for ntfy's systemd drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/ntfy.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Limit ntfy's memory and restart it if it stops
      ansible.builtin.copy:
        dest: /etc/systemd/system/ntfy.service.d/homelab.conf
        content: |
          # Managed by Ansible (homelab-proxmox dns/, role ntfy).
          # This host is also the LAN's primary resolver.
          [Service]
          MemoryMax={{ ntfy_memory_max }}
          Restart=always
          RestartSec=5
        owner: root
        group: root
        mode: "0644"
      notify: Restart ntfy

    - name: Enable and start ntfy
      ansible.builtin.systemd_service:
        name: ntfy
        enabled: true
        state: started

    - name: Apply configuration changes now
      ansible.builtin.meta: flush_handlers

# Not a secret, but kept out of the repos: the Pi's tailnet name is in
# public certificate transparency logs. The phone needs it (NTFY.md);
# monitoring's `mise run agent install` finds it through the laptop's own
# Tailscale.
- name: Show the server's address
  ansible.builtin.debug:
    msg: "The private ntfy is at {{ _ntfy_base_url }} (the server for the phone, dns/NTFY.md)."

# ---------------------------------------------------------------------------
# Prove it: up, closed to strangers, open to a token
# ---------------------------------------------------------------------------

- name: Check the server
  when: _ntfy_present and not ansible_check_mode
  block:
    - name: Wait for ntfy to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ntfy_port }}/v1/health"
        return_content: true
      register: _ntfy_health
      until: _ntfy_health.json.healthy | default(false)
      retries: 10
      delay: 3

    - name: Anonymous reads are refused (deny-all)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ntfy_port }}/{{ ntfy_topics.alerts }}/json?poll=1"
        status_code: [401, 403]

    - name: Each client reaches the topics it may read (token, or the phone's password)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ntfy_port }}/{{ item.1 | regex_replace(':.*$', '') }}/json?poll=1"
        headers:
          Authorization: >-
            {{ ('Bearer ' ~ ntfy_tokens[item.0.name]) if item.0.name in ntfy_tokens
               else ('Basic ' ~ (item.0.name ~ ':' ~ ntfy_passwords[item.0.name]) | b64encode) }}
        status_code: 200
      loop: "{{ ntfy_clients | subelements('access') }}"
      loop_control:
        label: "{{ item.0.name }} {{ item.1 }}"
      when: item.1 is search(':(ro|rw)$')
      no_log: true
