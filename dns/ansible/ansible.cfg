[defaults]
# A directory: terraform (dns/terraform) writes inventory/pihole.yml into it,
# group_vars/ next to it is hand-authored.
inventory          = inventory/
inventory_ignore_extensions = .example, .md, ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo
roles_path         = roles
# Default for the LXC container: Ansible connects as its root, over SSH with
# the deploy key Terraform authorised. The Raspberry Pi overrides this in
# inventory/hosts.yml (its own user + ansible_become).
remote_user        = root
private_key_file   = ~/.ssh/homelab-proxmox
host_key_checking  = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

[ssh_connection]
pipelining = True
