---
# The Pi's notification services, 2 of 3: the private ntfy server. Users,
# access rules from group_vars/ntfy.yml; credentials from ../../secrets.yaml
# (`mise run secrets:generate` makes them).
#
#   mise run dns:play:ntfy playbooks/40-ntfy.yml --check --diff
- name: Private ntfy
  hosts: ntfy
  gather_facts: true
  roles:
    - ntfy
