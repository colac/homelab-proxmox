---
# The TrueNAS configuration, declared. Field names are the TrueNAS API's
# (v25.10): https://api.truenas.com/v25.10/ — see roles/truenas/defaults for
# how each list is identified and what is immutable.
#
# Managed here means: change it HERE, not in the UI, or the next run puts it
# back. Pools, network interfaces, mail and alerts stay manual (RUNBOOK.md B2);
# the web UI's certificate is playbooks/40-certificate.yml (needs secrets).

# ---------------------------------------------------------------------------
# Groups and users — from the live system (discovery, 2026-10-16). UIDs and
# GIDs are today's values: pool files and ACLs are owned by number.
# truenas_admin and the builtin_* accounts are TrueNAS's own: not managed.
# Membership is declared on the user (`groups`), not on the group.
# ---------------------------------------------------------------------------
truenas_groups:
  # Primary groups of the two SMB users.
  - {name: nextcloud_user, gid: 3000, smb: false}
  - {name: home_user, gid: 3001, smb: false}
  # Has MODIFY on the media share's ACL: membership is what grants SMB access.
  - {name: smb_users, gid: 3002, smb: true}

truenas_users:
  # Nextcloud's external storage logs in as this user; its password is
  # workloads' nextcloud/secrets.yaml (nextcloud_nas_password).
  - username: nextcloud_user
    uid: 3000
    full_name: nextcloud_user
    group: nextcloud_user
    groups: [smb_users, builtin_users]
    smb: true
    home: /var/empty
    shell: /usr/sbin/nologin
  # The household's SMB login (PCs, phones).
  - username: home_user
    uid: 3001
    full_name: home_user
    group: home_user
    groups: [smb_users, builtin_users]
    smb: true
    home: /var/empty
    shell: /usr/sbin/nologin

# ---------------------------------------------------------------------------
# Datasets and shares — from the live system (discovery, 2026-10-16).
# The pools' root datasets (hdd-home-1, backup-usb) come with the pools and
# are not declared; backup-usb/media is created by the replication task.
# ---------------------------------------------------------------------------
truenas_datasets:
  # share_type SMB sets what discovery shows on all three: NFSv4 ACLs,
  # aclmode RESTRICTED, case-insensitive names. Both are fixed at creation.
  - {name: hdd-home-1/media, share_type: SMB, casesensitivity: INSENSITIVE}
  - {name: hdd-home-1/media/hugo, share_type: SMB, casesensitivity: INSENSITIVE}
  - {name: hdd-home-1/media/marta, share_type: SMB, casesensitivity: INSENSITIVE}

truenas_smb_shares:
  # Access comes from the dataset's ACL (root:root; builtin_administrators
  # FULL_CONTROL, smb_users MODIFY), which lives on the pool, not here.
  - name: media
    path: /mnt/hdd-home-1/media
    purpose: DEFAULT_SHARE
    comment: ""
    enabled: true
    readonly: false
    browsable: true
    access_based_share_enumeration: false

# NFS is off; the Nextcloud Borg export will be the first (workloads).
truenas_nfs_shares: []

# ---------------------------------------------------------------------------
# Backups: daily snapshots of everything under media, copied to the USB disk.
#
# The disk (pool backup-usb, created by hand, encrypted with a key kept in the
# password manager) is plugged in for a run and stored elsewhere otherwise:
#   mise run truenas:play playbooks/20-backup-usb.yml
# ---------------------------------------------------------------------------
truenas_snapshot_tasks:
  # Kept 8 weeks so a common snapshot survives a month or more without the
  # disk: incremental sends need one on both sides, and the replication task
  # never starts from scratch (allow_from_scratch: false) — that would wipe
  # the backup first.
  - dataset: hdd-home-1/media
    recursive: true
    naming_schema: "auto-%Y-%m-%d_%H-%M"
    schedule: {minute: "00", hour: "01", dom: "*", month: "*", dow: "*", begin: "00:00", end: "23:59"}
    lifetime_value: 8
    lifetime_unit: WEEK
    # Snapshot even when nothing changed: media sits still for weeks, and
    # skipped empty snapshots would let the last one age out, leaving no
    # common snapshot with the disk. Empty ones cost next to nothing.
    allow_empty: true
    enabled: true

truenas_replication_tasks:
  - name: media-to-backup-usb
    direction: PUSH
    transport: LOCAL
    source_datasets: [hdd-home-1/media]
    target_dataset: backup-usb/media
    recursive: true
    periodic_snapshot_tasks:
      - {dataset: hdd-home-1/media, naming_schema: "auto-%Y-%m-%d_%H-%M"}
    # Run on demand (20-backup-usb.yml): the disk is unplugged most days.
    auto: false
    # The pool is encrypted; the copy takes the pool's key instead of
    # arriving in plaintext from the unencrypted source.
    encryption: true
    encryption_inherit: true
    # Snapshots on the disk outlive the source's 8 weeks: monthly history.
    retention_policy: CUSTOM
    lifetime_value: 6
    lifetime_unit: MONTH
    allow_from_scratch: false
    readonly: SET
    enabled: true

# ---------------------------------------------------------------------------
# System settings and services — from the live system (2026-11-08), so a
# reinstall comes back the same. Each key is an API namespace; only the fields
# listed are managed.
# ---------------------------------------------------------------------------
truenas_settings:
  network.configuration:
    hostname: truenas
    domain: local
    nameserver1: 192.168.1.153     # the Pi-hole container (core dns/)
    nameserver2: 192.168.1.1       # the router, while the Pi-hole is down
  system.general:
    timezone: Europe/Lisbon
    kbdmap: pt
    # No usage statistics to iXsystems.
    usage_collection: false
  ssh:
    # Keys only. If the key is unavailable, the web UI's shell still works.
    passwordauth: false
    tcpfwd: false
  smb:
    netbiosname: truenas
    workgroup: WORKGROUP
    description: TrueNAS Server
    enable_smb1: false
    aapl_extensions: false
    multichannel: false

# Started at boot. SSH must be: Ansible and the update procedure log in with it.
truenas_services:
  cifs: true
  ssh: true
  nfs: false
  ftp: false
  iscsitarget: false
  nvmet: false
  snmp: false
  ups: false

truenas_ntp_servers:
  - {address: 0.debian.pool.ntp.org, iburst: true}
  - {address: 1.debian.pool.ntp.org, iburst: true}
  - {address: 2.debian.pool.ntp.org, iburst: true}

# TrueNAS creates one when a pool is created or imported; declared so a
# reinstall keeps the schedule. backup-usb's comes and goes with its import.
truenas_scrub_tasks:
  - pool: hdd-home-1
    threshold: 35
    schedule: {minute: "00", hour: "00", dom: "*", month: "*", dow: "7"}
    enabled: true

# Metrics for monitoring's Elastic Stack: netdata pushes Graphite to the
# graphite-exporter on the monitoring VM. A contract with that repo:
# - destination: the monitoring VM (its inventory), graphite-exporter's
#   ingest port 9109;
# - prefix `truenas`: its mapping file keys off it;
# - namespace: its `exporters_truenas_instance`, the instance label;
# - update_every: its `exporters_scrape_period` (60s).
# netdata's own config (/etc/netdata/netdata.conf) is a file, not an API
# setting: monitoring's RUNBOOK 4a, redone after each TrueNAS update.
truenas_reporting_exporters:
  - name: monitoring
    enabled: true
    attributes:
      exporter_type: GRAPHITE
      destination_ip: 192.168.1.87
      destination_port: 9109
      prefix: truenas
      namespace: truenas
      update_every: 60
      send_names_instead_of_ids: true

# ---------------------------------------------------------------------------
# The web UI's certificate (playbooks/40-certificate.yml): Let's Encrypt for
# truenas.<zone> through DNS-01 at Cloudflare, so nothing is exposed.
# TrueNAS renews it by itself. The zone and the token come from
# TrueNAS/secrets.yaml (`mise run truenas:certificate`), so the real domain
# never appears in this repo. Pi-hole's `truenas` record points the name here.
# ---------------------------------------------------------------------------
truenas_certificate_name: truenas
truenas_certificate_fqdn: "truenas.{{ lookup('env', 'DNS_ZONE') }}"
truenas_acme_dns_token: "{{ lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') }}"
truenas_acme_directory: https://acme-v02.api.letsencrypt.org/directory
# Days before expiry that TrueNAS renews (its maximum; Let's Encrypt certs
# last 90 days).
truenas_certificate_renew_days: 30
# http:// → https://. 30-update.yml downloads from the middleware's own port,
# so the redirect does not affect it.
truenas_ui_https_redirect: true

# ---------------------------------------------------------------------------
# Updates (playbooks/30-update.yml): every imported pool gets a recursive
# preupdate-* snapshot before an update, except these. The USB disk holds
# replicated copies, which its replication task already versions.
# ---------------------------------------------------------------------------
truenas_update_skip_pools: [backup-usb]
