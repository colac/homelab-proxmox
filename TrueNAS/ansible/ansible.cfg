[defaults]
inventory          = inventory/
inventory_ignore_extensions = .example, .md, ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo
roles_path         = roles
# The role's module, also for playbooks that call it directly (90-selftest.yml).
library            = roles/truenas/library
# truenas_admin is TrueNAS's own admin account; its SSH key is the login.
remote_user        = truenas_admin
private_key_file   = ~/.ssh/truenas_admin
host_key_checking  = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
deprecation_warnings = False

[privilege_escalation]
# No sudo: TrueNAS authenticates a local midclt connection as the calling user
# and applies that user's roles — truenas_admin is FULL_ADMIN (verified on
# 25.10.7). truenas_admin's sudo needs a password, so this also means no -K.
become         = False

[ssh_connection]
pipelining = True
