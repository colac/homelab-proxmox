[defaults]
# Core's own machines: the Proxmox host (inventory/hosts.yml, git-ignored)
# and the Pi-hole container, from the inventory core's dns/ Terraform writes.
inventory          = inventory/,../dns/ansible/inventory/pihole.yml
inventory_ignore_extensions = .example, .md, ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo
# The Pi-hole component's apply_role (pihole: tasks_from update).
roles_path         = ../dns/ansible/roles
# colac.homelab from this checkout (a symlink to ../ansible), not a tag:
# core runs the procedure it ships. The other repos install their pinned tag.
collections_path   = collections
private_key_file   = ~/.ssh/homelab-proxmox
host_key_checking  = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
display_skipped_hosts = False

[ssh_connection]
pipelining = True
