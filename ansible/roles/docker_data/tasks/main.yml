---
# tasks file for docker_data — LVM on the Terraform-attached data disk,
# mounted at /var/lib/docker.
#
# Three states this has to handle, and it must tell them apart before writing
# anything:
#
#   raw disk        pvcreate -> vgcreate -> lvcreate -> mkfs -> seed -> mount
#   already ours    LVM PV carrying docker_data_vg: adopt it, never reformat.
#                   This is the path taken when a populated disk is detached
#                   from one VM and attached to another.
#   anything else   refuse. A partition table or a foreign filesystem means
#                   the device variable is wrong, and pvcreate would destroy
#                   whatever is there.

- name: Check whether a docker data device is attached
  ansible.builtin.stat:
    path: "{{ docker_data_device }}"
  register: _docker_data_device

- name: Report that no docker data disk is attached
  ansible.builtin.debug:
    msg: >-
      {{ docker_data_device }} is not present, so {{ inventory_hostname }}
      keeps /var/lib/docker on the OS disk. Attach one by setting
      data_disk_size in this host's Terraform project and re-applying.
  when: not _docker_data_device.stat.exists

- name: Configure the docker data disk
  when:
    - docker_data_enabled | bool
    - _docker_data_device.stat.exists
  block:

    # ---------------------------------------------------------------------
    # Identify what is on the device before touching it
    # ---------------------------------------------------------------------
    - name: Read the on-disk signature of the data device
      # blkid exits 2 on a device with no signature at all, which is the
      # normal "fresh disk" case, so a non-zero rc is not an error here.
      ansible.builtin.command:
        cmd: "blkid -p -o value -s TYPE {{ docker_data_device }}"
      register: _docker_data_signature
      changed_when: false
      # Every read in this role runs under --check as well: skipped, it would
      # register nothing, and the safety asserts that follow would judge an
      # empty result instead of the real disk.
      check_mode: false
      failed_when: false

    - name: Refuse to overwrite a device that is not blank or an LVM member
      ansible.builtin.assert:
        that:
          - _docker_data_signature.stdout | trim in ['', 'LVM2_member']
        fail_msg: >-
          {{ docker_data_device }} carries a
          '{{ _docker_data_signature.stdout | trim }}' signature, which is
          neither blank nor an LVM physical volume. Refusing to run pvcreate
          over it. Either docker_data_device points at the wrong disk, or this
          disk holds something that has to be moved off by hand first.
        quiet: true

    - name: Read the volume group already present on the data device
      ansible.builtin.command:
        cmd: "pvs --noheadings --readonly -o vg_name {{ docker_data_device }}"
      register: _docker_data_existing_vg
      changed_when: false
      check_mode: false
      failed_when: false
      when: _docker_data_signature.stdout | trim == 'LVM2_member'

    - name: Refuse to adopt a physical volume belonging to another volume group
      ansible.builtin.assert:
        that:
          - _docker_data_existing_vg.stdout | trim in ['', docker_data_vg]
        fail_msg: >-
          {{ docker_data_device }} is already a physical volume in volume
          group '{{ _docker_data_existing_vg.stdout | trim }}', not
          '{{ docker_data_vg }}'. If this disk was moved from another host,
          rename its group first — `vgrename <vg-uuid> {{ docker_data_vg }}`,
          using the UUID from `vgs -o vg_name,vg_uuid` — then re-run. Renaming
          by UUID matters when both groups share a name.
        quiet: true
      when: _docker_data_signature.stdout | trim == 'LVM2_member'

    # A dry run cannot get further than this on a blank disk: under --check,
    # lvg only reports that it *would* create the volume group, so lvol then
    # fails looking for a group that does not exist. Everything that guards
    # the disk has already run by this point, which is what a dry run is for.
    - name: Report where a dry run on a blank disk stops
      ansible.builtin.debug:
        msg: >-
          {{ docker_data_device }} is blank, so a real run will create
          {{ docker_data_vg }}/{{ docker_data_lv }} on it and mount it at
          {{ docker_data_mount_path }}. --check cannot simulate past volume
          group creation, so the dry run for this host ends here.
      when: ansible_check_mode and (_docker_data_signature.stdout | trim) == ''

    - name: End the dry run on a blank disk
      ansible.builtin.meta: end_host
      when: ansible_check_mode and (_docker_data_signature.stdout | trim) == ''

    # ---------------------------------------------------------------------
    # Create or extend the LVM stack
    # ---------------------------------------------------------------------
    - name: Ensure the volume group spans the data device
      community.general.lvg:
        vg: "{{ docker_data_vg }}"
        pvs: "{{ docker_data_device }}"
        state: present

    - name: Ensure the logical volume exists and fills the volume group
      # resizefs grows the filesystem after the LV grows, so enlarging the
      # Proxmox disk and re-running this role is the whole growth path.
      # shrink: false makes a smaller size a no-op rather than data loss.
      community.general.lvol:
        vg: "{{ docker_data_vg }}"
        lv: "{{ docker_data_lv }}"
        size: "{{ docker_data_lv_size }}"
        resizefs: true
        shrink: false
        state: present

    - name: Ensure the filesystem exists on the logical volume
      # force is left at its default of false, so an adopted volume that
      # already carries a filesystem is never reformatted.
      community.general.filesystem:
        dev: "/dev/{{ docker_data_vg }}/{{ docker_data_lv }}"
        fstype: "{{ docker_data_fstype }}"

    # ---------------------------------------------------------------------
    # Seed a brand-new filesystem from whatever /var/lib/docker already holds
    # ---------------------------------------------------------------------
    - name: Check whether the data volume is already mounted at its final path
      ansible.builtin.command:
        cmd: "findmnt --noheadings --output SOURCE --target {{ docker_data_mount_path }}"
      register: _docker_data_current_mount
      changed_when: false
      check_mode: false
      failed_when: false

    # findmnt reports the device-mapper name, which doubles every hyphen in
    # the VG and LV names: docker-vg/docker-lv is /dev/mapper/docker--vg-docker--lv.
    # Matching on the bare LV name never hit, so this block re-ran on every
    # play — harmless only because the copy refuses a non-empty volume.
    - name: Seed the data volume from the existing /var/lib/docker
      when: >-
        (_docker_data_current_mount.stdout | default('') | trim) !=
        '/dev/mapper/' ~ (docker_data_vg | replace('-', '--')) ~ '-'
        ~ (docker_data_lv | replace('-', '--'))
      block:
        - name: Create the temporary seed mount point
          ansible.builtin.file:
            path: "{{ docker_data_seed_mount }}"
            state: directory
            mode: "0755"

        - name: Mount the data volume at the seed point
          ansible.posix.mount:
            path: "{{ docker_data_seed_mount }}"
            src: "/dev/{{ docker_data_vg }}/{{ docker_data_lv }}"
            fstype: "{{ docker_data_fstype }}"
            state: mounted
            # ephemeral: this must never reach /etc/fstab
            fstab: /tmp/docker_data_seed.fstab

        - name: Look for existing content on the data volume
          ansible.builtin.find:
            paths: "{{ docker_data_seed_mount }}"
            excludes: "lost+found"
            file_type: any
            hidden: true
          register: _docker_data_volume_content

        - name: Look for existing content in /var/lib/docker
          ansible.builtin.find:
            paths: "{{ docker_data_mount_path }}"
            file_type: any
            hidden: true
          register: _docker_data_local_content

        # Only a volume that is genuinely empty gets seeded. A disk carrying
        # another host's containers must be adopted untouched — copying the
        # local /var/lib/docker over it would destroy exactly the data the
        # move was meant to preserve.
        - name: Stop Docker before copying its state
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - docker.service
            # The socket unit restarts docker.service on demand, so stopping
            # the service alone is not enough to keep /var/lib/docker quiet.
            - docker.socket
          when:
            - _docker_data_volume_content.matched == 0
            - _docker_data_local_content.matched > 0

        # rsync -aHAX, not synchronize's `archive: true` (-rlptgoD) and not
        # cp -a. Docker's overlay2 store leans on hardlinks between layers and
        # on trusted.overlay.* extended attributes; a copy that drops -H
        # duplicates every shared file, and one that drops -X produces layers
        # the driver cannot read. --numeric-ids keeps ownership correct if the
        # volume is ever mounted on a host with different passwd entries.
        #
        # noqa command-instead-of-module: ansible-lint wants
        # ansible.posix.synchronize here. That module is built for control-node
        # to target transfers over SSH; this is a copy between two paths on the
        # same host, and its `archive` option cannot express -H/-A/-X without
        # dropping to rsync_opts anyway. Calling rsync directly is clearer.
        - name: Copy the existing Docker state onto the data volume # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              rsync -aHAX --numeric-ids
              {{ docker_data_mount_path }}/
              {{ docker_data_seed_mount }}/
          changed_when: true
          when:
            - _docker_data_volume_content.matched == 0
            - _docker_data_local_content.matched > 0

        - name: Unmount the seed point
          ansible.posix.mount:
            path: "{{ docker_data_seed_mount }}"
            state: unmounted
            fstab: /tmp/docker_data_seed.fstab

        - name: Remove the temporary seed mount point
          ansible.builtin.file:
            path: "{{ docker_data_seed_mount }}"
            state: absent

    # ---------------------------------------------------------------------
    # Mount it for real
    #
    # Note: whatever /var/lib/docker held before is still on the OS disk,
    # shadowed by this mount, and still occupying space in ubuntu-vg/root. On
    # a freshly built VM that is a few MB and not worth chasing. To reclaim it
    # on a host that had already pulled images:
    #   mkdir /mnt/root && mount -o bind / /mnt/root
    #   rm -rf /mnt/root/var/lib/docker/*   # verify the path first
    #   umount /mnt/root
    # Left manual on purpose — it deletes data underneath a live mount.
    # ---------------------------------------------------------------------
    - name: Read the filesystem UUID of the data volume
      ansible.builtin.command:
        cmd: "blkid -o value -s UUID /dev/{{ docker_data_vg }}/{{ docker_data_lv }}"
      register: _docker_data_fs_uuid
      changed_when: false
      # Runs under --check too. Skipped, the command module still registers
      # stdout as '' (not undefined), so a dry run used to "mount" UUID= here.
      # A blank disk's dry run has already ended above; an empty result means
      # there is no filesystem to mount, and the tasks below skip.
      check_mode: false
      failed_when: false

    - name: Mount the data volume at /var/lib/docker
      # By UUID rather than /dev/sdb: the device name depends on enumeration
      # order, which changes the moment this disk is attached to a host that
      # has a different number of disks.
      ansible.posix.mount:
        path: "{{ docker_data_mount_path }}"
        src: "UUID={{ _docker_data_fs_uuid.stdout | trim }}"
        fstype: "{{ docker_data_fstype }}"
        opts: "{{ docker_data_mount_opts }}"
        state: mounted
      notify: Start docker
      when: _docker_data_fs_uuid.stdout | trim | length > 0

    # ---------------------------------------------------------------------
    # Put containerd's root on the data volume as well
    #
    # With Docker's containerd image store, images and container layers live
    # in /var/lib/containerd, not under /var/lib/docker, so the mount above
    # does not cover them. Left alone, every pull lands on the 12G OS root
    # while the data disk sits empty — which is how the monitoring VM's root
    # filled with ~5G of Elastic images and apt stopped working.
    #
    # A bind mount, not containerd's `root =` in config.toml (a containerd.io
    # conffile, so a dpkg prompt on every upgrade) and not turning the image
    # store off in daemon.json (it is Docker's default now, and opting out
    # re-pulls every image). Both daemons keep their stock paths; one disk
    # holds all container state, so moving the disk moves images too.
    # ---------------------------------------------------------------------
    - name: Check whether containerd's root is already a mount point
      ansible.builtin.command:
        cmd: "findmnt --noheadings --mountpoint {{ docker_data_containerd_path }}"
      register: _docker_data_containerd_mount
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Move containerd's root onto the data volume
      when:
        - _docker_data_containerd_mount.rc != 0
        - _docker_data_fs_uuid.stdout | trim | length > 0
      block:
        - name: Create containerd's directory on the data volume
          ansible.builtin.file:
            path: "{{ docker_data_containerd_source }}"
            state: directory
            owner: root
            group: root
            mode: "0711"

        - name: Look for existing containerd state on the data volume
          ansible.builtin.find:
            paths: "{{ docker_data_containerd_source }}"
            file_type: any
            hidden: true
          register: _docker_data_containerd_volume_content

        # Always, even with nothing to copy: containerd holds meta.db open,
        # and mounting over a live root would split its state across two
        # filesystems.
        - name: Stop Docker and containerd before moving containerd's root
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - docker.socket
            - docker.service
            - containerd.service

        # With the daemons down nothing should be mounted beneath containerd's
        # root. If something is (a stuck unpack in tmpmounts/), rsync would
        # copy through it and the removal below would delete through it.
        - name: List mounts beneath containerd's root
          ansible.builtin.command:
            cmd: findmnt --noheadings --list --output TARGET
          register: _docker_data_mounts
          changed_when: false
          check_mode: false

        - name: Refuse to move containerd's root while something is mounted inside it
          ansible.builtin.assert:
            that:
              - _docker_data_nested_mounts | length == 0
            fail_msg: >-
              {{ _docker_data_nested_mounts | join(', ') }} still mounted
              beneath {{ docker_data_containerd_path }} with containerd stopped.
              Unmount them by hand, then re-run. Docker and containerd are
              stopped now; `systemctl start docker` brings them back meanwhile.
            quiet: true
          vars:
            _docker_data_nested_mounts: >-
              {{ _docker_data_mounts.stdout_lines
                 | select('match', '^' ~ docker_data_containerd_path ~ '/')
                 | list }}

        # Same flags and reasons as the /var/lib/docker seed above: overlayfs
        # snapshots need hardlinks (-H) and xattrs (-X) intact. Skipped when
        # the volume already carries containerd state — a disk adopted from
        # another host, whose images win; this host's own copy then stays
        # shadowed on the OS disk, like /var/lib/docker's does.
        - name: Copy containerd's state onto the data volume # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              rsync -aHAX --numeric-ids
              {{ docker_data_containerd_path }}/
              {{ docker_data_containerd_source }}/
          register: _docker_data_containerd_copy
          changed_when: true
          when: _docker_data_containerd_volume_content.matched == 0

        # This is the step that frees the OS disk. Unlike /var/lib/docker's
        # reclaim, which is left manual above, it is safe to automate: the
        # original is not under a mount yet, and rsync has just exited 0.
        # The bind mount below recreates the empty mount point. Not a handler:
        # it has to run before that mount, not at the end of the play. "Not
        # skipped" means the copy ran, and a failed rsync ends the play first.
        - name: Remove containerd's old root from the OS disk
          ansible.builtin.file:
            path: "{{ docker_data_containerd_path }}"
            state: absent
          when: _docker_data_containerd_copy is not skipped

    - name: Bind-mount containerd's root from the data volume
      # x-systemd.requires-mounts-for orders the bind after the data volume at
      # boot, so it never lands on the empty directory underneath it.
      ansible.posix.mount:
        path: "{{ docker_data_containerd_path }}"
        src: "{{ docker_data_containerd_source }}"
        fstype: none
        opts: "bind,nofail,x-systemd.requires-mounts-for={{ docker_data_mount_path }}"
        state: mounted
      register: _docker_data_containerd_bind
      when: _docker_data_fs_uuid.stdout | trim | length > 0

    # nofail keeps the host bootable without its data disk, but it also drops
    # both mounts' ordering against local-fs.target, so nothing stopped
    # containerd or dockerd from starting first and writing to the OS disk.
    # RequiresMountsFor restores the ordering and fails closed: with the disk
    # gone the VM still boots, but Docker stays down instead of starting
    # empty on the OS root — a fresh, empty Elasticsearch is worse than none.
    - name: Create the systemd drop-in directories for containerd and Docker
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - containerd.service
        - docker.service

    - name: Make containerd and Docker require their data mounts
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.unit }}.d/docker-data.conf"
        content: |
          # Managed by Ansible (docker_data role).
          [Unit]
          RequiresMountsFor={{ item.path }}
        owner: root
        group: root
        mode: "0644"
      loop:
        - { unit: containerd.service, path: "{{ docker_data_containerd_path }}" }
        - { unit: docker.service, path: "{{ docker_data_mount_path }}" }
      register: _docker_data_dropins

    - name: Reload systemd for the new drop-ins and fstab entries
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: _docker_data_dropins is changed or _docker_data_containerd_bind is changed

    - name: Ensure Docker is running on the new mount
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - containerd.service
        - docker.socket
        - docker.service
