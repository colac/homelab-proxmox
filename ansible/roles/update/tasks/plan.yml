---
# On the controller, once per run: compare every target's facts with upstream
# releases, write the JSON report, and keep the plan on localhost, where
# apply reads it (per host: what apply may do). Delegated from the targets'
# play rather than a localhost play, so --limit can never leave it out.
- name: Compare with upstream and write the report
  ansible.builtin.command:
    cmd: "python3 {{ role_path }}/files/plan.py"
    stdin: "{{ _update_input | to_json }}"
  vars:
    _update_hosts: >-
      {% set out = {} %}
      {% for h in ansible_play_hosts %}
      {%   set hv = hostvars[h] %}
      {%   set _ = out.update({h: {
             'kind': hv.update_kind,
             'facts': hv.update_facts | default(none),
             'proxmox_name': hv.update_proxmox_name | default(none),
             'components': hv.update_components | selectattr('hosts', 'contains', h) | list}}) %}
      {% endfor %}
      {{ out | to_json }}
    _update_input:
      phase: "{{ update_phase }}"
      # The directory ansible-playbook was started from (PWD), not the
      # playbook's: for a collection playbook that is the collection itself.
      report_dir: "{{ update_report_dir or (lookup('ansible.builtin.env', 'PWD') ~ '/reports') }}"
      hosts: "{{ _update_hosts | trim | from_json }}"
      guests: "{{ hostvars['localhost'].update_guest_list | default([]) }}"
      check_untracked_guests: >-
        {{ (groups['proxmox_hosts'] | default([]))[:1] | intersect(groups['update_targets']) | length > 0 }}
      guests_elsewhere: "{{ update_guests_elsewhere }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: _update_plan
  changed_when: false
  check_mode: false

- name: Keep the plan
  ansible.builtin.set_fact:
    update_plan: "{{ _update_plan.stdout | from_json }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: Show the report
  ansible.builtin.debug:
    msg: "{{ hostvars['localhost'].update_plan.summary }}"
  run_once: true
