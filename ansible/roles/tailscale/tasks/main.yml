---
- name: Ensure the Tailscale binary is present (installed by the Packer template)
  ansible.builtin.command: tailscale version
  register: tailscale_version
  changed_when: false
  failed_when: tailscale_version.rc != 0

- name: Ensure tailscaled is running and enabled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Read current Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false

- name: Determine backend state
  ansible.builtin.set_fact:
    tailscale_state: >-
      {{ (tailscale_status_raw.stdout | from_json).BackendState
         if (tailscale_status_raw.stdout | length > 0) else 'Unknown' }}

- name: Authenticate to the tailnet (auth key supplied and not already running)
  ansible.builtin.command: >-
    tailscale up
    --authkey {{ tailscale_authkey }}
    --hostname {{ tailscale_hostname }}
    --advertise-routes {{ tailscale_advertise_routes }}
    {{ tailscale_up_extra_args }}
  no_log: true
  when:
    - tailscale_authkey | length > 0
    - tailscale_state != 'Running'
  changed_when: true

- name: Re-read Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_recheck
  changed_when: false
  failed_when: false

- name: Update backend state
  ansible.builtin.set_fact:
    tailscale_state: >-
      {{ (tailscale_status_recheck.stdout | from_json).BackendState
         if (tailscale_status_recheck.stdout | length > 0) else 'Unknown' }}

- name: Ensure subnet routes stay advertised (idempotent, also when already up)
  ansible.builtin.command: >-
    tailscale set --advertise-routes {{ tailscale_advertise_routes }}
  when:
    - tailscale_state == 'Running'
    - tailscale_advertise_routes | length > 0
  changed_when: false

- name: Warn when the node is not yet authenticated
  ansible.builtin.debug:
    msg:
      - "Tailscale is installed but not authenticated (state: {{ tailscale_state }})."
      - "Run on the host: sudo tailscale up --hostname {{ tailscale_hostname }} --advertise-routes {{ tailscale_advertise_routes }} --ssh"
      - "or re-run with -e tailscale_authkey=tskey-auth-XXXX."
  when: tailscale_state != 'Running'

- name: Remind to approve the subnet route in the admin console
  ansible.builtin.debug:
    msg:
      - "Approve the advertised route {{ tailscale_advertise_routes }} in the"
      - "Tailscale admin console (Machines -> this node -> Edit route settings),"
      - "and add a split-DNS nameserver for your public domain (the parent zone"
      - "of the Nextcloud domain) pointing at the PiHole."
  when: tailscale_state == 'Running'
