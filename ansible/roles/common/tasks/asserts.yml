---
# Preflight only — nothing here changes anything. Its job is to fail loudly and
# early on the mistakes that otherwise surface many plays later as something
# unrelated-looking.

- name: Report the detected OS
  ansible.builtin.debug:
    msg: "{{ ansible_os_family }} > {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Assert the inventory carries a usable address
  ansible.builtin.assert:
    that:
      - ansible_host is defined
      - ansible_host | length > 0
      - ansible_host != 'None'
    fail_msg: >-
      {{ inventory_hostname }} has no ansible_host. For a Terraform-generated
      fragment this means the QEMU guest agent had not reported an IP yet —
      re-run `terraform apply` in that project to regenerate it.
    quiet: true

- name: Check distribution compatibility
  ansible.builtin.fail:
    msg: "{{ ansible_distribution }} is not supported by these roles"
  when: ansible_distribution not in ['Ubuntu']

- name: Fail if not a supported release of Ubuntu
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version"
  when: ansible_distribution == "Ubuntu" and ansible_distribution_version is version_compare(22.04, '<')

- name: Verify Docker is installed (baked in by the Packer template)
  ansible.builtin.command: docker --version
  register: _common_docker_check
  changed_when: false
  # Read-only, so it runs under --check too — skipped, it registers no rc and
  # the check below it would fail on a healthy host.
  check_mode: false
  failed_when: _common_docker_check.rc != 0

- name: Verify the Docker Compose plugin is installed
  ansible.builtin.command: docker compose version
  register: _common_compose_check
  changed_when: false
  check_mode: false
  failed_when: _common_compose_check.rc != 0
