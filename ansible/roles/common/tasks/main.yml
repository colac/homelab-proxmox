---
# tasks file for common — preflight checks for a host cloned from this repo's
# Packer template. Nothing here changes anything; it fails early, and names
# the real cause, when a host is not what the later plays assume.
#
# Deliberately generic: every consumer (monitoring, workloads) runs it.
# Checks that belong to one workload live in that workload's repo — the
# Elasticsearch prerequisites, for one, are asserted by the monitoring repo's
# elastic_preflight role.

- name: Include checks/asserts
  ansible.builtin.include_tasks: asserts.yml
