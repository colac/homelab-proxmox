---
# Create Nextcloud users via occ, idempotent. Requires the container to be
# running (i.e. AIO first-run setup completed). Passwords come from vault via
# nextcloud_aio_users[].password.

- name: Check the Nextcloud AIO app container is running
  ansible.builtin.command: docker exec nextcloud-aio-nextcloud true
  register: nextcloud_aio_users_running
  changed_when: false
  failed_when: false

- name: Note when Nextcloud is not running yet
  ansible.builtin.debug:
    msg: >-
      nextcloud-aio-nextcloud is not running. Finish the AIO first-run setup
      (admin UI on port {{ nextcloud_aio_admin_port }}) and start the
      containers, then re-run this playbook to create users.
  when: nextcloud_aio_users_running.rc != 0

- name: Create configured Nextcloud users
  when: nextcloud_aio_users_running.rc == 0
  block:
    - name: List existing Nextcloud users
      ansible.builtin.command: >-
        docker exec --user www-data nextcloud-aio-nextcloud
        php occ user:list --output=json
      register: nextcloud_aio_users_list
      changed_when: false

    - name: Create each configured user
      ansible.builtin.command:
        cmd: >-
          docker exec --user www-data -e OC_PASS={{ nextcloud_aio_user.password }}
          nextcloud-aio-nextcloud
          php occ user:add --password-from-env
          --display-name="{{ nextcloud_aio_user.display_name | default(nextcloud_aio_user.name) }}"
          {{ nextcloud_aio_user.name }}
      loop: "{{ nextcloud_aio_users }}"
      loop_control:
        loop_var: nextcloud_aio_user
        label: "{{ nextcloud_aio_user.name }}"
      when: nextcloud_aio_user.name not in (nextcloud_aio_users_list.stdout | from_json)
      no_log: true
      changed_when: true
