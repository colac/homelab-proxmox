---
# Attach SMB shares (TrueNAS) as Nextcloud external storage, via occ inside the
# AIO Nextcloud container. Requires the container to be running (i.e. AIO
# first-run setup completed). SMB credentials come from vault.
#
# One external-storage mount is created per entry in nextcloud_aio_nas_mounts.
# NOTE: occ files_external JSON field names (mount_id, mount_point) are stable
# on current Nextcloud; adjust if you run a much older release.

- name: Check the Nextcloud AIO app container is running
  ansible.builtin.command: docker exec nextcloud-aio-nextcloud true
  register: nextcloud_aio_nas_running
  changed_when: false
  failed_when: false

- name: Note when Nextcloud is not running yet
  ansible.builtin.debug:
    msg: >-
      nextcloud-aio-nextcloud is not running. Finish the AIO first-run setup
      (admin UI on port {{ nextcloud_aio_admin_port }}) and start the containers,
      then re-run this playbook to attach the NAS.
  when: nextcloud_aio_nas_running.rc != 0

- name: Configure the NAS external storage
  when: nextcloud_aio_nas_running.rc == 0
  block:
    - name: Ensure the External Storage app is enabled
      ansible.builtin.command: >-
        docker exec --user www-data nextcloud-aio-nextcloud
        php occ app:enable files_external
      register: nextcloud_aio_nas_app
      changed_when: "'already enabled' not in nextcloud_aio_nas_app.stdout"

    - name: Attach each configured NAS mount
      ansible.builtin.include_tasks: nas_mount.yml
      loop: "{{ nextcloud_aio_nas_mounts }}"
      loop_control:
        loop_var: nextcloud_aio_nas_mount
        label: "{{ nextcloud_aio_nas_mount.name }}"

    # Private per-user folders, derived from nextcloud_aio_users (vault) rather
    # than listed above, so usernames stay out of the tracked repo. Each is
    # scoped to its owner: without applicable_users a personal folder would be
    # visible and writable to every other account. Looping over usernames only
    # (not the whole user dict) keeps passwords out of the loop items.
    - name: Attach a private NAS folder for each user that has one
      ansible.builtin.include_tasks: nas_mount.yml
      loop: >-
        {{ nextcloud_aio_users | default([])
           | selectattr('nas_folder', 'defined')
           | selectattr('nas_folder')
           | map(attribute='name') | list }}
      loop_control:
        loop_var: nextcloud_aio_nas_owner
        label: "{{ nextcloud_aio_nas_owner }}"
      vars:
        nextcloud_aio_nas_mount:
          name: "{{ nextcloud_aio_nas_owner }}"
          share: "{{ nextcloud_aio_nas_personal_share }}"
          subfolder: "{{ nextcloud_aio_nas_owner }}"
          applicable_users: ["{{ nextcloud_aio_nas_owner }}"]
