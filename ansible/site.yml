---
- name: Configure the Nextcloud host
  hosts: nextcloud
  become: true
  gather_facts: true
  pre_tasks:
    - name: Assert the public domain is provided (it lives in vault.yml)
      ansible.builtin.assert:
        that:
          - nextcloud_domain is defined
          - nextcloud_domain | length > 0
        fail_msg: >-
          nextcloud_domain is not set. Add it to vault.yml
          (cd ansible && ansible-vault edit vault.yml) — it was moved there to
          keep the hostname out of the tracked repo. Caddy and AIO both need it.
        quiet: true
  roles:
    - role: tailscale
    - role: nextcloud_aio
    - role: reverse_proxy
