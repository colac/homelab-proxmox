---
# The update procedure each repo runs for its own machines:
#
#   ansible-playbook colac.homelab.update                         report only
#   ansible-playbook colac.homelab.update -e update_apply=true    snapshot, apt, apps
#     -e update_reboot=true      … and reboot guests that need it
#     -e update_allow_pve=true   … and the Proxmox host's packages (core)
#     -e '{"update_force": ["Nextcloud AIO"]}'   … run a component's update anyway
#     --limit <host>             … only that host (the plan and the guest list
#                                still come along: they run from this play)
#
# Consumers wrap it in their own `mise run update` tasks; the inventory
# contract is in roles/update/defaults/main.yml, the rules in core's
# docs/UPDATES.md.
- name: Before — read every update target, list the Proxmox guests, plan
  hosts: update_targets
  gather_facts: false
  vars:
    update_phase: before
  tasks:
    - name: Gather update facts
      ansible.builtin.include_role:
        name: colac.homelab.update
        tasks_from: gather

    - name: List the Proxmox node's guests
      ansible.builtin.include_role:
        name: colac.homelab.update
        tasks_from: guests

    - name: Compare with upstream and plan
      ansible.builtin.include_role:
        name: colac.homelab.update
        tasks_from: plan

- name: Apply, one host at a time in inventory order
  hosts: update_targets
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Apply this host's updates
      ansible.builtin.include_role:
        name: colac.homelab.update
        tasks_from: apply
      when: update_apply | default(false) | bool

- name: After — read every update target again and report
  hosts: update_targets
  gather_facts: false
  vars:
    update_phase: after
  tasks:
    - name: Gather update facts
      ansible.builtin.include_role:
        name: colac.homelab.update
        tasks_from: gather
      when: update_apply | default(false) | bool

    - name: Compare with upstream and report
      ansible.builtin.include_role:
        name: colac.homelab.update
        tasks_from: plan
      when: update_apply | default(false) | bool
